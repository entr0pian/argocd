apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: taskapp-infra
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - merge:
              mergeKeys:
                - name
              generators:
                - git:
                    repoURL: "https://github.com/entr0pian/application-repositories.git"
                    revision: main
                    requeueAfterSeconds: 30
                    files:
                      - path: "infra/*/*.yaml"
                - git:
                    repoURL: "https://github.com/entr0pian/application-repositories.git"
                    revision: main
                    requeueAfterSeconds: 30
                    files:
                      - path: "values/*/*.yaml"
          - clusters:
              selector:
                matchLabels:
                  environment: "{{`{{ trimSuffix \".yaml\" .path.filename }}`}}"
  template:
    metadata:
      name: "{{`{{.name}}`}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "{{`{{.wave}}`}}"
        notifications.argoproj.io/subscribe.on-sync-succeeded.slack: "{{`{{ if .notify }}`}}deployments{{`{{ end }}`}}"
        notifications.argoproj.io/subscribe.on-sync-failed.slack: "{{`{{ if .notify }}`}}deployments{{`{{ end }}`}}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: "{{`{{.repoURL}}`}}"
        targetRevision: "{{`{{.targetRevision}}`}}"
        chart: "{{`{{.chart}}`}}"
        path: "{{`{{.chartPath}}`}}"
        helm:
          releaseName: "{{`{{.path.basename}}`}}"
          values: "{{`{{.values}}`}}"
      destination:
        server: "{{`{{.server}}`}}"
        namespace: "{{`{{.namespace}}`}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - "CreateNamespace={{`{{.createNamespace}}`}}"
          - "ServerSideApply={{`{{.serverSideApply}}`}}"
  # Optional per-file `ignoreDifferences` (standard Application syntax). Set
  # it only for charts that render non-deterministic fields (e.g. a webhook
  # cert from genSignedCert, new on every render): the listed fields are
  # neither diffed nor re-applied once the resource exists, so ArgoCD can't
  # re-sync one half of a cert/CA pair with a fresh render. syncOptions is
  # repeated in full because a patch replaces lists rather than merging them.
  templatePatch: |
    {{`{{- if hasKey . "ignoreDifferences" }}`}}
    spec:
      ignoreDifferences:
        {{`{{- toYaml .ignoreDifferences | nindent 4 }}`}}
      syncPolicy:
        syncOptions:
          - "CreateNamespace={{`{{.createNamespace}}`}}"
          - "ServerSideApply={{`{{.serverSideApply}}`}}"
          - "RespectIgnoreDifferences=true"
    {{`{{- end }}`}}
