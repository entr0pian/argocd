apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: taskapp-catalog
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - merge:
              mergeKeys:
                - name
              generators:
                - git:
                    repoURL: "https://github.com/entr0pian/application-repositories.git"
                    revision: main
                    files:
                      - path: "catalog/*/*.yaml"
                - git:
                    repoURL: "https://github.com/entr0pian/application-repositories.git"
                    revision: main
                    files:
                      - path: "values/*/*.yaml"
          - clusters:
              selector:
                matchLabels:
                  environment: "{{`{{ trimSuffix \".yaml\" .path.filename }}`}}"
  template:
    metadata:
      name: "{{`{{.name}}`}}"
      namespace: argocd
      annotations:
        argocd.argoproj.io/sync-wave: "5"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: "{{`{{.repoURL}}`}}"
        targetRevision: "{{`{{.targetRevision}}`}}"
        path: "{{`{{.chartPath}}`}}"
        helm:
          releaseName: "{{`{{.path.basename}}`}}"
          values: "{{`{{.values}}`}}"
      destination:
        server: "{{`{{.server}}`}}"
        namespace: "{{`{{.namespace}}`}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
