apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: taskapp-catalog
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - git:
              repoURL: "https://github.com/entr0pian/application-repositories.git"
              revision: main
              requeueAfterSeconds: 30
              files:
                - path: "components/*/environments/*.yaml"
          - clusters:
              selector:
                matchLabels:
                  environment: "{{`{{ .environment }}`}}"
  template:
    metadata:
      name: "{{`{{ index .path.segments 1 }}`}}-{{`{{ .environment }}`}}"
      namespace: argocd
      labels:
        platform.taskapp.io/component: "{{`{{ index .path.segments 1 }}`}}"
        platform.taskapp.io/environment: "{{`{{ .environment }}`}}"
        platform.taskapp.io/type: service
        # Same label contract as taskapp-platform's Applications: name is
        # what this Application delivers (here, the service itself).
        platform.taskapp.io/name: "{{`{{ index .path.segments 1 }}`}}"
      annotations:
        argocd.argoproj.io/sync-wave: "5"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      sources:
        - repoURL: "{{`{{ .source.repoURL }}`}}"
          targetRevision: "{{`{{ .source.targetRevision }}`}}"
          path: "{{`{{ .source.chartPath }}`}}"
          helm:
            releaseName: "{{`{{ index .path.segments 1 }}`}}"
            valueFiles:
              - "$values/components/{{`{{ index .path.segments 1 }}`}}/values/{{`{{ .environment }}`}}.yaml"
            # Platform identity, from the identity file's own path/fields
            # (never the values file): the chart stamps these onto its
            # workloads as platform.taskapp.io/{component,environment}
            # labels — the same contract as this Application's labels
            # above, so pods can be found by component + environment
            # (BACKSTAGE_PART8.md). Charts that don't read them ignore them.
            parameters:
              - name: platform.component
                value: "{{`{{ index .path.segments 1 }}`}}"
              - name: platform.environment
                value: "{{`{{ .environment }}`}}"
        - repoURL: "https://github.com/entr0pian/application-repositories.git"
          targetRevision: main
          ref: values
      destination:
        server: "{{`{{.server}}`}}"
        namespace: "{{`{{.namespace}}`}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
