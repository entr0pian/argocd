repoURL: "https://github.com/entr0pian/helm-charts.git"
targetRevision: main
destinationServer: "https://kubernetes.default.svc"
kubePrometheusStack:
  enabled: true
externalSecrets:
  enabled: true
keda:
  enabled: true
crossplane:
  enabled: true
  secretPath: ""
argocdWriteToken:
  secretPath: ""
crossplaneGithub:
  secretPath: ""
crossplaneProviderConfig:
  enabled: true
  kubernetes:
    enabled: true
  aws:
    enabled: true
  github:
    enabled: false
crossplaneCompositions:
  enabled: false
platform:
  enabled: true
  limitRange:
    enabled: true
  prometheusRules:
    enabled: true
  grafanaDashboard:
    enabled: true
atlasOperator:
  enabled: true
operator:
  enabled: false
  repoURL: "https://github.com/entr0pian/backend-operator.git"
  targetRevision: main
applicationRepositoryOperator:
  repoURL: "https://github.com/entr0pian/application-repository-operator.git"
  targetRevision: main
  requeueInterval: ""
applicationRepositories:
  repoURL: "https://github.com/entr0pian/application-repositories.git"
  targetRevision: main
notifications:
  slack:
    channel: deployments
repositories:
  backend:
    repoURL: https://github.com/entr0pian/backend.git
    targetRevision: main
    chartPath: chart
